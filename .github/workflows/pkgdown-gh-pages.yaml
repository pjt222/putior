# Alternative pkgdown workflow using gh-pages branch deployment
# This workflow builds the pkgdown site and deploys to gh-pages branch
# rather than using the newer GitHub Actions deployment method

on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown-gh-pages

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every .md file in the package root as a page. Only
      # the files listed here belong on the site; the others (CLAUDE.md,
      # CRAN_REVIEW.md, ...) are development notes. The checkout is thrown
      # away after the job, so removing them here changes nothing else.
      - name: Keep development notes off the site
        run: |
          for md_file in *.md; do
            case "$md_file" in
              README.md|NEWS.md|LICENSE.md|CODE_OF_CONDUCT.md|CONTRIBUTING.md|cran-comments.md) ;;
              *) echo "Not publishing $md_file"; rm -- "$md_file" ;;
            esac
          done
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages
          clean: true