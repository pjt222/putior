url: https://pjt222.github.io/putior/
template:
  bootstrap: 5
  bootswatch: cosmo
  light-switch: true
  bslib:
    primary: "#2563eb"
    base_font: {google: "Fira Sans"}
    heading_font: {google: "Fira Sans"}
    code_font: {google: "Fira Code"}
  includes:
    in_header: |
      <!-- Mermaid is loaded only on pages that have a diagram (#63). Keep
           this pin and its integrity hash in sync with
           inst/shiny/putior-sandbox/app.R. -->
      <style>
        /* While Mermaid loads, show nothing rather than the diagram source */
        html.mermaid-loading pre.mermaid { display: none; }
      </style>
      <script>
        document.documentElement.classList.add('mermaid-loading');

        var mermaidScript = {
          src: 'https://cdn.jsdelivr.net/npm/mermaid@12.2.0/dist/mermaid.min.js',
          integrity: 'sha384-8xUhuLNMjW/cI2Dacg3DR4WliYznvIg0LVG1stctThKD/YVrJFI9TNCFxft5NYgp'
        };

        // Theme-aware Mermaid configuration
        // Light colors aligned with putior default theme
        // Dark colors aligned with agent-almanac/viz cyberpunk palette
        var mermaidThemes = {
          light: {
            theme: 'default',
            themeVariables: {
              primaryColor: '#f0f4ff',
              primaryTextColor: '#1e293b',
              primaryBorderColor: '#2563eb',
              lineColor: '#64748b',
              secondaryColor: '#f8fafc',
              tertiaryColor: '#f1f5f9'
            }
          },
          dark: {
            theme: 'dark',
            themeVariables: {
              primaryColor: '#1a1a2e',
              primaryTextColor: '#e0e0e8',
              primaryBorderColor: '#00f0ff',
              lineColor: '#888899',
              secondaryColor: '#16213e',
              tertiaryColor: '#0f3460'
            }
          }
        };

        function isDarkMode() {
          return document.documentElement.getAttribute('data-bs-theme') === 'dark';
        }

        function getMermaidConfig() {
          var colors = isDarkMode() ? mermaidThemes.dark : mermaidThemes.light;
          return {
            startOnLoad: false,
            // Stays 'strict' (Mermaid's default): 'loose' would make
            // enable_clicks links work, but also let click callbacks run
            // JavaScript (#47)
            securityLevel: 'strict',
            // Mermaid 12 defaults to the ELK layout and the neo look, wraps labels
            // at 120px and makes nodes at least 120px wide. Keep Mermaid 11's
            // classic rendering, which putior's themes are made for and which
            // GitLab, Quarto and VS Code still show.
            layout: 'dagre',
            look: 'classic',
            theme: colors.theme,
            themeVariables: colors.themeVariables,
            flowchart: { htmlLabels: true, curve: 'linear', wrappingWidth: 200, minNodeWidth: 0 }
          };
        }

        // Diagram sources, kept for re-rendering when the theme changes
        var mermaidSources = [];

        // pkgdown turns ```mermaid fences into <pre class="mermaid">. Replace
        // each one with a container and keep its source. Other code blocks are
        // left alone, even when they mention flowchart or graph.
        function collectMermaidBlocks() {
          document.querySelectorAll('pre.mermaid').forEach(function(pre) {
            var container = document.createElement('div');
            container.className = 'mermaid-container';
            container.setAttribute('role', 'img');
            container.setAttribute('aria-label', 'Workflow diagram');
            pre.parentElement.insertBefore(container, pre);
            pre.style.display = 'none';
            mermaidSources.push({ container: container, source: pre.textContent.trim() });
          });
        }

        // Render (or re-render) every collected diagram with the current theme
        function renderMermaidDiagrams() {
          mermaid.initialize(getMermaidConfig());
          var mermaidDivs = mermaidSources.map(function(entry) {
            entry.container.innerHTML = '';
            var mermaidDiv = document.createElement('div');
            mermaidDiv.className = 'mermaid';
            mermaidDiv.textContent = entry.source;
            entry.container.appendChild(mermaidDiv);
            return mermaidDiv;
          });
          if (mermaidDivs.length > 0) {
            mermaid.run({ nodes: mermaidDivs }).catch(function(err) {
              console.error('Mermaid render failed: ', err);
            });
          }
        }

        // Re-render when the Bootstrap light switch changes the theme
        function watchThemeChanges() {
          var observer = new MutationObserver(function(mutations) {
            mutations.forEach(function(m) {
              if (m.attributeName === 'data-bs-theme') {
                setTimeout(renderMermaidDiagrams, 50);
              }
            });
          });
          observer.observe(document.documentElement, { attributes: true });
        }

        // Only a few pages have diagrams, and the Mermaid bundle is large
        // (1.57 MB gzipped), so load it only where it is needed, with the
        // same integrity check as a <script> tag. The diagram source is
        // hidden while it loads; if it cannot be loaded, the source is shown.
        function setUpMermaidDiagrams() {
          if (!document.querySelector('pre.mermaid')) {
            document.documentElement.classList.remove('mermaid-loading');
            return;
          }
          var script = document.createElement('script');
          script.src = mermaidScript.src;
          script.integrity = mermaidScript.integrity;
          script.crossOrigin = 'anonymous';
          script.onload = function() {
            // Stop Mermaid from rendering the <pre class="mermaid"> blocks by
            // itself on page load; they are rendered here with the site's theme.
            mermaid.initialize({ startOnLoad: false });
            collectMermaidBlocks();
            document.documentElement.classList.remove('mermaid-loading');
            renderMermaidDiagrams();
            watchThemeChanges();
          };
          script.onerror = function() {
            console.error('Mermaid could not be loaded from ' + mermaidScript.src);
            document.documentElement.classList.remove('mermaid-loading');
          };
          document.head.appendChild(script);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', setUpMermaidDiagrams);
        } else {
          setUpMermaidDiagrams();
        }
      </script>
    after_body: |
      <style>
        /* Fira font family overrides */
        :root {
          --font-family-sans-serif: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          --font-family-monospace: 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
        }

        body, .navbar, .btn {
          font-family: var(--font-family-sans-serif) !important;
        }

        pre, code, kbd, samp, .sourceCode {
          font-family: var(--font-family-monospace) !important;
        }

        .mermaid {
          font-family: var(--font-family-sans-serif) !important;
        }

        div.mermaid-container {
          text-align: center;
          margin: 1em 0;
        }
      </style>

home:
  title: "putior: Register In- and Outputs for Workflow Visualization"
  description: >
    Extract structured annotations from source code files and generate 
    Mermaid flowchart diagrams for visualizing workflows and data pipelines.
  
  links:
  - text: Report a bug
    href: https://github.com/pjt222/putior/issues
  - text: Browse source code
    href: https://github.com/pjt222/putior

